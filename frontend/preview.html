<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda preview</title><meta name="robots" content="noindex">
<style>body{margin:0;padding:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#16233f}</style></head>
<body><div id="mount"></div>
<script>
  // Loads the real embed script exactly as a customer's website would.
  var q = new URLSearchParams(location.search), s = document.createElement('script');
  s.src = '/embed.js'; s.dataset.event = q.get('event') || ''; s.dataset.target = '#mount';
  if (q.get('accent')) s.dataset.accent = q.get('accent'); if (q.get('theme')) s.dataset.theme = q.get('theme'); if (q.get('interval')) s.dataset.interval = q.get('interval');
  document.body.appendChild(s);
</script></body></html>
