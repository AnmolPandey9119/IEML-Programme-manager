<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="backend-url" content="https://ieml-programme-manager.onrender.com">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEML EventCore</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f4ee">
  <script>try{var t=localStorage.getItem("pm-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">

  <style id="splash-css">
  html.splash-on,html.splash-on body{overflow:hidden}
  #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#fff;
    background-image:radial-gradient(900px 520px at 50% 42%,#f3f6fd,#fff 70%);
    transition:opacity .55s ease,transform .55s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #splash.out{opacity:0;transform:scale(1.035);pointer-events:none}
  #splash .sp-stage{position:relative;width:min(84vw,520px);aspect-ratio:520/540}
  #splash img{position:absolute;display:block;height:auto;user-select:none;-webkit-user-drag:none;opacity:0}
  #splash .sp-ieml{left:15%;top:0.5%;width:30%}
  #splash .sp-mark{left:49%;top:6.1%;width:24%;--s:-14deg;
    -webkit-mask-image:conic-gradient(from -90deg at 50% 50%,#000 0,#000 var(--s),transparent calc(var(--s) + 14deg));
    mask-image:conic-gradient(from -90deg at 50% 50%,#000 0,#000 var(--s),transparent calc(var(--s) + 14deg))}
  #splash .sp-word{left:0;top:42%;width:100%;clip-path:inset(0 100% 0 0)}
  #splash .sp-tag{left:6%;top:73%;width:88%}
  #splash.go .sp-ieml{animation:spSlide .7s cubic-bezier(.2,.8,.2,1) .05s both}
  #splash.go .sp-mark{animation:spBuild 1.1s cubic-bezier(.2,.8,.2,1) .35s both}
  #splash.go .sp-word{animation:spWipe .75s cubic-bezier(.65,0,.2,1) 1.0s both}
  #splash.go .sp-tag{animation:spRise .6s ease 1.7s both}
  #splash.go .sp-stage{animation:spSettle .55s ease 2.3s both}
  @keyframes spSlide{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
  @keyframes spLine{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
  @keyframes spBuild{0%{opacity:0;transform:scale(.8) rotate(-10deg)}12%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes spWipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
  @keyframes spRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes spSettle{0%,100%{transform:none}45%{transform:scale(1.025)}}
  @media (prefers-reduced-motion:reduce){
    #splash.go .sp-ieml,#splash.go .sp-mark,#splash.go .sp-word,#splash.go .sp-tag{animation:spFade .4s ease both}
    #splash .sp-word{clip-path:none}#splash .sp-mark{-webkit-mask-image:none;mask-image:none}#splash.go .sp-stage{animation:none}
    #splash.out{transform:none}}
  @keyframes spFade{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
  <div id="splash" role="img" aria-label="IEML EventCore. Every event, organised.">
    <div class="sp-stage">
      <img class="sp-ieml" src="/assets/ieml-logo.png" alt="" draggable="false">
      <img class="sp-mark" src="/assets/ec-mark.png" alt="" draggable="false">
      <img class="sp-word" src="/assets/ec-wordmark.png" alt="" draggable="false">
      <img class="sp-tag" src="/assets/ec-tagline.png" alt="" draggable="false">
    </div>
  </div>
  <script>
  (function () {
    var el = document.getElementById('splash'); if (!el) return;
    var hash = location.hash || '';
    var seen = false; try { seen = sessionStorage.getItem('pm-splash') === '1'; } catch (e) {}
    var force = /[?&]splash=1/.test(location.search);
    // Not shown on public links (speaker form / shared agenda), and only once per browser session.
    if (/^#\/(shared|speaker-form)/.test(hash) || (seen && !force)) { el.remove(); return; }
    try { sessionStorage.setItem('pm-splash', '1'); } catch (e) {}
    var root = document.documentElement; root.classList.add('splash-on');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var mark = el.querySelector('.sp-mark'), done = false, started = false;
    var SWEEP_FROM = 350, SWEEP_TO = 1250, TOTAL = reduce ? 1100 : 2900;
    function finish() {
      if (done) return; done = true; el.classList.add('out');
      setTimeout(function () { el.remove(); root.classList.remove('splash-on'); }, 600);
    }
    function start() {
      if (started) return; started = true; var t0 = performance.now(); el.classList.add('go');
      if (!reduce) (function tick(now) {            // the mark is "drawn" clockwise
        var p = Math.min(1, Math.max(0, (now - t0 - SWEEP_FROM) / (SWEEP_TO - SWEEP_FROM)));
        mark.style.setProperty('--s', (-14 + (1 - Math.pow(1 - p, 3)) * 374) + 'deg');
        if (p < 1) requestAnimationFrame(tick);
        else { mark.style.webkitMaskImage = 'none'; mark.style.maskImage = 'none'; }
      })(t0);
      setTimeout(finish, TOTAL);
    }
    // wait for the images so the animation never starts on half-loaded pieces
    var imgs = [].slice.call(el.querySelectorAll('img')), left = imgs.length;
    function one() { if (--left <= 0) start(); }
    imgs.forEach(function (im) { if (im.complete) one(); else { im.addEventListener('load', one); im.addEventListener('error', one); } });
    setTimeout(start, 1500);
    el.addEventListener('click', finish); document.addEventListener('keydown', finish, { once: true });
  })();
  </script>
  <div id="app"></div>
  <div id="layer"></div>
  <div id="toasts" aria-live="polite"></div>
  <button class="theme-btn theme-float" data-act="toggleTheme" aria-label="Switch between light and dark theme" title="Switch theme"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
